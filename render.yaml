# ═══════════════════════════════════════════════════════════════════════
# تقنيات سوفت Pro - License Server Blueprint (Render.com)
# ═══════════════════════════════════════════════════════════════════════
# قاعدة البيانات: Neon PostgreSQL خارجي (لا نستخدم Render Postgres)
# ═══════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: ts-pro-license-server
    runtime: node
    plan: free
    region: frankfurt   # قريب من Neon EU Central
    branch: main
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health

    envVars:
      # قاعدة البيانات — يجب ضبطها يدوياً في Render → Environment
      - key: DATABASE_URL
        sync: false   # ⚠️ سرّي — أضفه من لوحة Render

      # ═══════════════════════════════════════════════════════════════════
      # JWT_SECRET — ⚠️ حاسم: يجب أن يطابق السرّ المخبوز في EXE v6.9.2 بالضبط
      # ═══════════════════════════════════════════════════════════════════
      # [إصلاح v6.9.2] سبب حلقة معالج الإعداد كان عدم تطابق هذا السرّ.
      # في Render → Environment أضِف JWT_SECRET بهذه القيمة *حرفياً*:
      #   tspro-b850a8f07324a984734f1883cc8317cdb33a4fd156b367081bf60bdf2176171b
      # ثم اضغط Manual Deploy. (نُبقيها sync:false حتى لا تُكشف في المستودع؛
      #  أضِفها يدوياً من لوحة Render بالقيمة أعلاه بالضبط.)
      - key: JWT_SECRET
        sync: false   # ⚠️ أضِفه يدوياً بالقيمة الموضّحة في التعليق أعلاه

      # Admin credentials — غيّرها لقيم قوية!
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false   # ⚠️ سرّي — أضفه من لوحة Render
      - key: ADMIN_SESSION_SECRET
        generateValue: true

      # Server
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0

      # CORS
      - key: CORS_ORIGINS
        value: "*"

      # Rate limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 60
