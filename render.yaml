# ═══════════════════════════════════════════════════════════════════════
# تقنيات سوفت Pro - License Server Blueprint (Render.com)
# ═══════════════════════════════════════════════════════════════════════
# قاعدة البيانات: Neon PostgreSQL خارجي (لا نستخدم Render Postgres)
# ═══════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: ts-pro-license-server
    runtime: node
    plan: free
    region: frankfurt   # قريب من Neon EU Central
    branch: main
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health

    envVars:
      # قاعدة البيانات — يجب ضبطها يدوياً في Render → Environment
      - key: DATABASE_URL
        sync: false   # ⚠️ سرّي — أضفه من لوحة Render

      # JWT — يجب أن يتطابق مع السرّ في الديسكتوب. سرّي: أضِفه يدوياً من لوحة Render.
      # ⚠️ v6.9.1: لا تضع القيمة هنا (تُكشف في المستودع). استخدم قيمة قوية عشوائية (≥32 حرفاً).
      - key: JWT_SECRET
        sync: false   # ⚠️ سرّي — أضفه من لوحة Render (Environment)

      # Admin credentials — غيّرها لقيم قوية!
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false   # ⚠️ سرّي — أضفه من لوحة Render
      - key: ADMIN_SESSION_SECRET
        generateValue: true

      # Server
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0

      # CORS
      - key: CORS_ORIGINS
        value: "*"

      # Rate limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 60
